name: Gerar instalador Windows (.exe)
on:
  push:
    branches: [main]
    paths: ['geres-desktop/**']
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: geres-software-publicar
  cancel-in-progress: false
jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar e gerar
        working-directory: geres-desktop
        run: |
          npm install
          npm run dist
      - name: Copiar para a raiz e gravar versão do exe
        shell: bash
        run: |
          cp geres-desktop/dist/GERES-Setup.exe ./GERES-Setup.exe
          node -e "
          const fs=require('fs');
          let d={}; try{d=JSON.parse(fs.readFileSync('versao-sistema.json','utf8'))}catch(e){}
          d.exeVersion=new Date().toISOString().slice(0,10).replace(/-/g,'')+'-'+process.env.GITHUB_RUN_NUMBER;
          d.exeUrl='https://gedremsisep-lgtm.github.io/geres-software/GERES-Setup.exe';
          fs.writeFileSync('versao-sistema.json',JSON.stringify(d));
          "
      - name: Commit
        shell: bash
        run: |
          git config user.name 'Publicador GERES'
          git config user.email 'publicador-geres@users.noreply.github.com'
          git add GERES-Setup.exe versao-sistema.json
          git commit -m 'Publicador GERES: GERES-Setup.exe' || exit 0
          git pull --rebase
          git push
